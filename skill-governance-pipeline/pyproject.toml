[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-governance-pipeline"
version = "0.1.0"
description = "Production-grade governance pipeline for OpenClaw skills and agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenClaw Engineering" }
]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "jsonschema>=4.20",
    "rich>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.23",
    "hypothesis>=6.0",
]
minimax = [
    "openai>=1.0",  # for MiniMax semantic scoring client (interface only)
]

[project.scripts]
skill-governance = "skill_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["skill_governance"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Branch coverage is the primary signal; line coverage is a fallback.
# Show entries missing branches (partial) to highlight gaps line coverage hides.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
precision = 1

[tool.coverage.html]
directory = "htmlcov"

[tool.setuptools.package-data]
skill_governance = ["py.typed"]
