[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-governance-pipeline"
version = "1.0.0"
description = "Production-grade governance pipeline for OpenClaw skills and agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenClaw Engineering" }
]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "jsonschema>=4.20",
    "rich>=13.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.23",
    "hypothesis>=6.0",
]
dev = [
    "mypy>=1.10",
    "ruff>=0.6",
    "types-PyYAML",
]
minimax = [
    "openai>=1.0",  # for MiniMax semantic scoring client (interface only)
]

[project.scripts]
skill-governance = "skill_governance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["skill_governance"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Branch coverage is the primary signal; line coverage is a fallback.
# Show entries missing branches (partial) to highlight gaps line coverage hides.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
precision = 1

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.13"
strict = true
# All source files in src/skill_governance are now fully type-annotated
# (see PR #58 / bucket C.2 of the v1.0.0 follow-up push). mypy strict
# mode passes with 0 issues.
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = false
files = ["src/skill_governance"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["output", "build", "dist", ".venv"]

[tool.ruff.lint]
# Pragmatic default rule set. Add "B", "S", "C4" etc. as the codebase
# matures.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter, not linter)
    "B008",  # function call in default argument (Click patterns rely on this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B",  # flake8-bugbear is too strict for test fixtures
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.package-data]
skill_governance = ["py.typed"]
