[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-discovery-analyzer"
version = "0.1.0"
description = "Deterministic repository discovery analyzer for OpenClaw workflows"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OpenClaw"}]

[project.scripts]
repo-discovery-analyzer = "repo_discovery_analyzer.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_discovery_analyzer*"]

