[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "application-test-automation-v2"
version = "0.1.0"
description = "Deterministic test automation coverage factory for large repositories"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]

[project.scripts]
test-factory = "test_factory.cli:main"

[project.optional-dependencies]
# Required for `python -m pytest` and for `test-factory run --generate-coverage`
# to actually produce coverage.json / coverage.xml. The fallback
# `scripts/run_tests.py` covers systems where pytest is not installed,
# but does not support --cov / --cov-report flags. Pin pytest<9 because
# pytest-cov 7.x references pytest.PytestWarning which pytest 9 removed
# (Bug #5, PR #24).
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "coverage>=7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["test_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

