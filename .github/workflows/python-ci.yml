name: Python CI
on: [pull_request]
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        # Use the official installer instead of the astral-sh/setup-uv action.
        # This CI was observed to fail with "Failed to resolve action download
        # info. Error: Service Unavailable" on the action. The installer
        # script is distro-agnostic and avoids the action registry entirely.
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Add elan/lake to PATH
        # The self-hosted runner on this host has elan and lake pre-installed
        # at /data/.elan/bin (the action leaked from the prior local setup).
        # The runner pick-up step doesn't add them to PATH for subsequent
        # steps, so we do it explicitly here. `make ci` includes `make lean`
        # which runs `lake build`.
        run: echo "/data/.elan/bin" >> "$GITHUB_PATH"
      - run: uv sync --group dev
      - run: make ci
