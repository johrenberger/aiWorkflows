name: nightly-dreaming-validation

on:
  pull_request:
    paths:
      - '.openclaw/dreaming/**'
      - 'tests/dreaming/**'
      - 'DREAMING.md'
      - '.github/workflows/nightly-dreaming-validation.yml'
  push:
    branches:
      - 'dreaming/nightly-execution-quality-*'
      - 'main'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute merge-base via GitHub API
        id: base
        # Use the GitHub compare API to get the merge-base SHA; avoids fragile
        # local-ref state that depends on fetch-depth and PR ref shape.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -n "${GITHUB_HEAD_REF:-}" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
            MB=$(gh api "repos/${{ github.repository }}/compare/${GITHUB_BASE_REF}...${GITHUB_HEAD_REF}" --jq '.merge_base_commit.sha' 2>/dev/null || echo "")
          else
            # push event fallback
            MB=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          fi
          if [ -z "$MB" ]; then
            echo "WARN: could not compute merge-base; commits prefix test will skip"
          else
            echo "merge-base=$MB"
          fi
          echo "merge_base=$MB" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run dreaming validation tests
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          DREAMING_MERGE_BASE: ${{ steps.base.outputs.merge_base }}
        run: pytest tests/dreaming/ -v

      - name: Check for forbidden hidden-reasoning markers
        # The grep below scans all artifact files. Files whose job is to document the
        # rule itself (README.md, validation-checklist.md) are excluded by name because
        # they necessarily mention the marker strings as part of describing the rule.
        run: |
          bash -c '
            set -e
            ALLOWLIST=(
              ".openclaw/dreaming/README.md"
              ".openclaw/dreaming/validation-checklist.md"
              ".openclaw/dreaming/workflow-nightly-dreaming.md"
            )
            EXCLUDES=""
            for f in "${ALLOWLIST[@]}"; do
              EXCLUDES+="--exclude=$(basename "$f") "
            done
            if grep -rEn $EXCLUDES "<<<REASONING>>>|<<<HIDDEN>>>|<reasoning>|</reasoning>|\[\[INTERNAL_THINKING\]\]" .openclaw/dreaming/ DREAMING.md; then
              echo "Forbidden hidden-reasoning marker found"
              exit 1
            fi
          '

      - name: Check exactly one dreaming branch in this PR
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          # On PRs, this is enforced by branch naming; on push, ensure we did not create two branches in one cycle.
          echo "Branch reference: $GITHUB_REF"

      - name: Ensure MiniMax brief is not auto-injected
        # The MiniMax brief is referenced by name (allowed) in some files. What is forbidden is any
        # configuration that loads it by default (e.g. agent spawn payloads, default prompt context).
        # We grep for forbidden injection verbs, excluding files that merely mention the brief.
        run: |
          bash -c '
            set -e
            ALLOWLIST=(
              ".openclaw/dreaming/README.md"
              ".openclaw/dreaming/validation-checklist.md"
              ".openclaw/dreaming/workflow-nightly-dreaming.md"
              ".openclaw/dreaming/DREAMING.md"
              "DREAMING.md"
            )
            EXCLUDES=""
            for f in "${ALLOWLIST[@]}"; do
              bn=$(basename "$f")
              EXCLUDES+="--exclude=$bn "
            done
            # Forbidden: a line that configures the brief to be auto-loaded.
            # Allowed phrases include "do not auto-inject", "not auto-loaded", etc.
            if grep -rEn $EXCLUDES \
              "system_prompt.*minimax_consumption|spawn_payload.*brief|auto_load_brief|default_context.*brief|auto.inject.*consumption" \
              .openclaw/dreaming/ DREAMING.md 2>/dev/null; then
              echo "MiniMax brief appears configured for auto-injection"
              exit 1
            fi
          '
