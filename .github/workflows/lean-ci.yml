name: Lean CI

on:
  pull_request:
    branches:
      - main
      - agent/bootstrap-research-monorepo
    paths:
      - 'lean-toolchain'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'Lean/**'
      - '.github/workflows/lean-ci.yml'
  push:
    branches:
      - main
      - agent/bootstrap-research-monorepo
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build and validate Lean
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build CoverageTree target
        run: lake build CollatzResearch.CoverageTree
