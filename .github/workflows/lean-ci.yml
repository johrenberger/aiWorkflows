name: Lean CI
on: [pull_request]
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Add elan/lake to PATH
        # Self-hosted runner on this host has elan and lake pre-installed at
        # /data/.elan/bin. Use the system copy instead of running the
        # elan-init.sh installer (which downloads Lean from the network).
        # The pinned toolchain (leanprover/lean4:v4.19.0) is the same one
        # the installer would put in place. lake-manifest.json locks
        # transitive revisions.
        run: echo "/data/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          which lake && lake --version
          cat lean-toolchain
      - run: make lean
