name: Nightly validation
on:
  schedule:
    # 02:00 UTC daily. Spaced 30+ min from typical PR-peak times so the
    # runner is free and the cache is cold for the night's sweep.
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Manual trigger for ad-hoc nightly runs.
jobs:
  heavy-validation:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Add elan/lake to PATH
        run: echo "/data/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lake-
      - run: uv sync --group dev
      - name: Nightly reproduction
        # Heavy validation that the PR gate should not pay: full
        # reproduction + (eventually) Hypothesis property-based suite +
        # regression corpus. Scaffolded now; full job content lands in a
        # future story when proof obligations are stable.
        run: make reproduce
