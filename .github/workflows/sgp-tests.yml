name: SGP Tests

on:
  push:
    branches: [main]
    paths:
      - "skill-governance-pipeline/**"
      - ".github/workflows/sgp-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "skill-governance-pipeline/**"
      - ".github/workflows/sgp-tests.yml"

defaults:
  run:
    working-directory: skill-governance-pipeline

jobs:
  test:
    name: pytest --cov
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skill-governance-pipeline/pyproject.toml

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with branch coverage
        run: |
          pytest --cov --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage threshold
        env:
          COVERAGE_FILE: .coverage
        run: |
          # Branch coverage gate. 94.0% is the current baseline at
          # v3 re-assessment (commit 8d7f8c1). To tighten this gate,
          # first run a deliberate gap-closure pass that raises the
          # floor, then bump this number to match.
          COVERAGE=$(coverage report --precision=1 | tail -1 | awk '{print $NF}')
          echo "Branch coverage: $COVERAGE"
          python -c "
          import sys
          cov = float(sys.argv[1].rstrip('%'))
          threshold = 94.0
          assert cov >= threshold, f'Branch coverage {cov}% below threshold {threshold}%'
          " "$COVERAGE"

      - name: Upload coverage to Codecov (optional)
        if: env.CODECOV_TOKEN != null
        uses: codecov/codecov-action@v4
        with:
          file: skill-governance-pipeline/coverage.xml
          flags: sgp
          fail_ci_if_error: false
