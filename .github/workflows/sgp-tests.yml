name: SGP Tests

on:
  push:
    branches: [main]
    paths:
      - "skill-governance-pipeline/**"
      - ".github/workflows/sgp-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "skill-governance-pipeline/**"
      - ".github/workflows/sgp-tests.yml"

defaults:
  run:
    working-directory: skill-governance-pipeline

jobs:
  test:
    name: pytest --cov
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 24
        # Silences the GitHub Actions Node 20 deprecation warning and pre-positions us
        # for the 2026-06-16 default switch to Node 24. We do not run any JS actions;
        # this step is purely a version pin on the runner image.
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skill-governance-pipeline/pyproject.toml

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install lint/type-check extras
        run: |
          pip install -e ".[dev]"

      - name: Run ruff lint
        run: |
          # Ruff is fast (sub-second) and strict. A failure here
          # means a real lint issue: unused import, deprecated
          # pattern, bug-prone construct.
          ruff check src/ tests/

      - name: Run mypy type check
        run: |
          # mypy is non-strict (warn_return_any, warn_unused_ignores)
          # but fails on real type errors. To tighten, raise the
          # strict mode in pyproject.toml [tool.mypy].
          mypy src/skill_governance/

      - name: Run tests with branch coverage
        run: |
          pytest --cov --cov-branch --cov-report=xml --cov-report=term-missing

      - name: Enforce branch coverage threshold
        env:
          COVERAGE_FILE: .coverage
        run: |
          # Branch coverage gate. 90% is the floor for catching real
          # regressions while absorbing minor CI fluctuations
          # (different platform, Python build, etc.).
          #
          # Local baseline is 94.1% (v3 re-assessment at 8d7f8c1).
          # If this gate ever fires, it means branch coverage has
          # dropped by 4+ percentage points — a real regression,
          # not a CI wobble.
          #
          # To RAISE the floor above 90%, first run a deliberate
          # gap-closure pass that lifts the local number, then bump
          # this number to match.
          coverage report --fail-under=90

      - name: Upload coverage to Codecov (optional)
        if: env.CODECOV_TOKEN != null
        uses: codecov/codecov-action@v4
        with:
          file: skill-governance-pipeline/coverage.xml
          flags: sgp
          fail_ci_if_error: false
